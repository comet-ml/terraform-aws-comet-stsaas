# Pre-commit hooks for this Terraform module.
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
#
# Notes:
# - Local hooks are fast and offline. terraform_validate and tflint need a
#   per-module `terraform init` (network + provider downloads) which is slow
#   and flaky as a commit hook, so both run in CI instead — see
#   .github/workflows/ci.yml.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  # Secret / credential scanning — blocks commits containing keys, tokens,
  # passwords, etc. Scans staged content on commit; full history on CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
